<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Cart — Mary's Scent</title><link rel="stylesheet" href="css/style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="index.html"><div class="brand-mark">M</div><div class="brand-text"><strong>MARY'S SCENT</strong><span>LUXURY FRAGRANCES</span></div></a><div class="nav-links"><a href="shop.html">Continue Shopping</a><a href="track.html">Track Order</a></div><div class="nav-actions"><button class="icon-btn menu-btn" data-menu>☰</button></div></div></nav><header class="page-head"><div class="container"><span class="eyebrow">Your selection</span><h1>Shopping cart</h1></div></header><main class="section"><div class="container"><div id="cartLayout" class="cart-layout"></div></div></main><div id="toast" class="toast"></div><script src="js/app.js"></script><script>function renderCart(){const box=document.querySelector('#cartLayout'),items=MS.cartDetails();if(!items.length){box.innerHTML='<div class="panel empty" style="grid-column:1/-1"><h2>Your cart is empty.</h2><p>Discover your next signature scent.</p><a class="btn btn-gold" href="shop.html">Shop Now</a></div>';return}const sub=MS.subtotal(),delivery=sub>=100000?0:3000;box.innerHTML=`<div class="panel"><h2>Your items</h2>${items.map(i=>`<div class="cart-row"><img src="${i.image}" alt="${i.name}"><div><strong>${i.name}</strong><div class="product-brand">${i.brand}</div><div>${MS.money(i.price)}</div></div><div class="qty"><button onclick="changeQty('${i.id}',-1)">−</button><span>${i.qty}</span><button onclick="changeQty('${i.id}',1)">+</button></div><strong>${MS.money(i.line)}</strong><button class="small-btn remove" onclick="MS.removeCart('${i.id}');renderCart()">Remove</button></div>`).join('')}</div><aside class="panel"><h2>Summary</h2><div class="summary-row"><span>Subtotal</span><strong>${MS.money(sub)}</strong></div><div class="summary-row"><span>Delivery</span><strong>${delivery?MS.money(delivery):'Free'}</strong></div><div class="summary-row total"><span>Total</span><strong>${MS.money(sub+delivery)}</strong></div><a class="btn btn-gold" style="width:100%;margin-top:18px" href="checkout.html">Proceed to Checkout</a><a class="btn btn-dark" style="width:100%;margin-top:8px;background:#111" href="https://wa.me/2349135095176?text=${encodeURIComponent('Hello Mary\'s Scent, I would like to place an order.')}">Order via WhatsApp</a></aside>`}function changeQty(id,d){const c=MS.cart(),i=c.find(x=>x.id===id),p=MS.get(MS.key.products,[]).find(x=>x.id===id);if(!i||!p)return;i.qty+=d;if(i.qty<=0)MS.removeCart(id);else if(i.qty>p.stock)i.qty=p.stock;MS.saveCart(c);renderCart()}renderCart();</script></body></html>
