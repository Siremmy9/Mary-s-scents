<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Checkout — Mary's Scent</title>
    <link rel="stylesheet" href="css/style.css"></head>
    <body>
        <nav class="navbar"><div class="container nav-inner">
        <a class="brand" href="index.html">
            <div class="brand-mark">M</div>
            <div class="brand-text"><strong>MARY'S SCENT</strong><span>LUXURY FRAGRANCES</span></div></a>
            <a class="btn btn-gold" href="cart.html">Back to Cart</a></div></nav>
            <main class="section"><div class="container"><div class="checkout-layout">
                <section class="panel"><span class="eyebrow">Secure checkout demo</span>
                    <h1 style="font:700 2.4rem Georgia,serif">Complete your order</h1>
                    <div id="checkoutNotice"></div><form id="checkoutForm" class="form-grid">
                        <div class="field"><label>Full name</label><input class="input" name="name" required></div>
                        <div class="field"><label>Phone number</label><input class="input" name="phone" required></div>
                        <div class="field"><label>Email</label><input class="input" type="email" name="email"></div>
                        <div class="field"><label>State</label><input class="input" name="state" required></div>
                        <div class="field"><label>City</label><input class="input" name="city" required></div>
                        <div class="field full"><label>Delivery address</label><textarea class="input textarea" name="address" required></textarea></div>
                        <div class="field full"><label>Payment method</label><select class="select" name="payment"><option>Bank Transfer</option>
                            <option>Cash on Delivery</option><option>Pay Online (Demo)</option>
                            <option>WhatsApp</option></select></div><div class="field full">
                                <label>Delivery instructions</label><textarea class="input textarea" name="instructions">

                                </textarea></div><div class="field full">
                                    <button class="btn btn-gold" type="submit">Place Order</button></div></form></section>
                                    <aside id="checkoutSummary" class="panel"></aside></div></div></main>
                                    <div id="toast" class="toast"></div><script src="js/app.js"></script>
                                    <script>const items=MS.cartDetails();const sub=MS.subtotal();
                                    const delivery=sub>=100000?0:3000;
                                    document.querySelector('#checkoutSummary').innerHTML=items.length?
                                    `<h2>Order summary</h2>${items.map(i=>`<div class="summary-row"><span>${i.name} × ${i.qty}</span><strong>${MS.money(i.line)}</strong></div>`).join('')}<div class="summary-row"><span>Delivery</span><strong>${delivery?MS.money(delivery):'Free'}</strong></div><div class="summary-row total"><span>Total</span><strong>${MS.money(sub+delivery)}</strong></div>`:'<div class="empty"><h3>Your cart is empty.</h3><a class="btn btn-gold" href="shop.html">Shop products</a></div>';document.querySelector('#checkoutForm')?.addEventListener('submit',e=>{e.preventDefault();if(!items.length)return;const f=new FormData(e.target),orders=MS.get(MS.key.orders,[]),products=MS.get(MS.key.products,[]),order={id:MS.id(),number:`MS-${new Date().getFullYear()}${String(new Date().getMonth()+1).padStart(2,'0')}${String(new Date().getDate()).padStart(2,'0')}-${String(orders.length+1).padStart(3,'0')}`,date:new Date().toISOString(),customer:{name:f.get('name'),phone:f.get('phone'),email:f.get('email'),state:f.get('state'),city:f.get('city'),address:f.get('address'),instructions:f.get('instructions')},payment:f.get('payment'),items:items.map(i=>({id:i.id,name:i.name,qty:i.qty,price:i.price,cost:i.cost,image:i.image})),subtotal:sub,delivery,total:sub+delivery,status:'Pending',source:'Online'};for(const item of items){const p=products.find(x=>x.id===item.id);if(!p||p.stock<item.qty){MS.toast(`Not enough stock for ${item.name}`);return}p.stock-=item.qty}MS.set(MS.key.products,products);orders.unshift(order);MS.set(MS.key.orders,orders);MS.set(MS.key.cart,[]);MS.log(`New online order ${order.number} received.`);document.querySelector('#checkoutForm').classList.add('hidden');document.querySelector('#checkoutNotice').innerHTML=`<div class="notice"><strong>Order placed successfully!</strong><br>Your order number is <strong>${order.number}</strong>.<br><a href="track.html?order=${order.number}">Track your order</a></div>`;document.querySelector('#checkoutSummary').innerHTML=`<div class="receipt"><h3>MARY'S SCENT</h3><p>Order: ${order.number}</p><p>Total: ${MS.money(order.total)}</p><p>Status: Pending</p></div>`});</script></body></html>
