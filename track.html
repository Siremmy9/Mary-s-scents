<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order — Mary's Scent</title><link rel="stylesheet" href="css/style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="index.html"><div class="brand-mark">M</div><div class="brand-text"><strong>MARY'S SCENT</strong><span>LUXURY FRAGRANCES</span></div></a><a class="btn btn-gold" href="shop.html">Shop</a></div></nav><main class="section"><div class="container tracking"><span class="eyebrow">Order updates</span><h1 style="font:700 3rem Georgia,serif">Track your order</h1><form id="trackForm" class="track-form"><input id="orderNo" class="input" placeholder="Enter order number e.g. MS-20260923-001" required><button class="btn btn-gold">Track</button></form><div id="result" style="margin-top:30px"></div></div></main><div id="toast" class="toast"></div><script src="js/app.js"></script><script>const statuses=['Pending','Confirmed','Processing','Shipped','Out for Delivery','Delivered'];function renderTrack(no){const o=MS.get(MS.key.orders,[]).find(x=>x.number.toLowerCase()===no.toLowerCase());const r=document.querySelector('#result');if(!o){r.innerHTML='<div class="panel empty"><h3>Order not found.</h3><p>Check the order number and try again.</p></div>';return}const idx=statuses.indexOf(o.status);r.innerHTML=`<div class="panel"><h2>Order ${o.number}</h2><p><strong>${o.customer.name}</strong> • ${MS.money(o.total)} • ${o.payment}</p><div class="timeline">${statuses.map((s,i)=>`<div class="step ${i<=idx?'active':''}"><div class="step-dot">${i<=idx?'✓':i+1}</div>${s}</div>`).join('')}</div><div class="table-wrap"><table class="table"><thead><tr><th>Item</th><th>Qty</th><th>Price</th></tr></thead><tbody>${o.items.map(i=>`<tr><td>${i.name}</td><td>${i.qty}</td><td>${MS.money(i.price*i.qty)}</td></tr>`).join('')}</tbody></table></div></div>`}document.querySelector('#trackForm').addEventListener('submit',e=>{e.preventDefault();renderTrack(document.querySelector('#orderNo').value.trim())});const p=new URLSearchParams(location.search).get('order');if(p){document.querySelector('#orderNo').value=p;renderTrack(p)}</script></body></html>
