<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — Mary's Scent</title><link rel="stylesheet" href="../css/style.css"></head><body class="admin-body"><div class="admin-shell"><aside class="sidebar"><a class="brand" href="../index.html"><div class="brand-mark">M</div><div class="brand-text"><strong>MARY'S SCENT</strong><span>LUXURY ADMIN</span></div></a><nav class="side-nav"><button class="active" data-section="overview">📊 Overview</button><button data-section="products">🧴 Products</button><button data-section="inventory">📦 Inventory</button><button data-section="orders">🛍️ Orders</button><button data-section="pos">🧾 Offline POS</button><button data-section="expenses">💰 Expenses</button><button data-section="customers">👥 Customers</button><button data-section="activity">📝 Activity Log</button><button data-section="settings">⚙️ Settings</button></nav><button id="logout" class="btn btn-dark" style="width:100%;margin-top:20px">Logout</button></aside><main class="admin-main"><div class="mobile-sidebar"><select id="mobileNav" class="select" style="width:100%;margin-bottom:18px"><option value="overview">Overview</option><option value="products">Products</option><option value="inventory">Inventory</option><option value="orders">Orders</option><option value="pos">Offline POS</option><option value="expenses">Expenses</option><option value="customers">Customers</option><option value="activity">Activity Log</option><option value="settings">Settings</option></select></div><div class="admin-top"><div><div class="eyebrow">Owner dashboard</div><h1>Business overview</h1></div><a class="btn btn-gold" href="../shop.html">View Store</a></div><section id="overview" class="admin-section active"><div id="stats" class="admin-cards"></div><div class="admin-grid"><div class="panel"><div class="section-head"><h2>Sales overview</h2><span id="salesRange"></span></div><div id="salesChart" class="chart"></div></div><div class="panel"><h2>Business snapshot</h2><div id="snapshot"></div></div></div><div class="panel" style="margin-top:18px"><h2>Recent orders</h2><div id="recentOrders" class="table-wrap"></div></div></section><section id="products" class="admin-section"><div class="panel"><div class="section-head"><h2>Products</h2><button class="btn btn-gold" onclick="openProductForm()">+ Add Product</button></div><div id="productsTable" class="table-wrap"></div></div></section><section id="inventory" class="admin-section"><div class="panel"><h2>Inventory</h2><div id="inventoryTable" class="table-wrap"></div></div></section><section id="orders" class="admin-section"><div class="panel"><h2>Orders</h2><div id="ordersTable" class="table-wrap"></div></div></section><section id="pos" class="admin-section"><div class="admin-grid"><div class="panel"><h2>Record offline sale</h2><form id="posForm" class="admin-form"><div class="field"><label>Product</label><select id="posProduct" class="select" required></select></div><div class="field"><label>Quantity</label><input id="posQty" class="input" type="number" min="1" value="1" required></div><div class="field"><label>Customer name</label><input id="posCustomer" class="input"></div><div class="field"><label>Customer phone</label><input id="posPhone" class="input"></div><div class="field"><label>Payment method</label><select id="posPayment" class="select"><option>Cash</option><option>Bank Transfer</option><option>POS</option><option>Other</option></select></div><div class="field full"><button class="btn btn-gold">Record Sale</button></div></form></div><div class="panel"><h2>Recent offline sales</h2><div id="offlineTable"></div></div></div></section><section id="expenses" class="admin-section"><div class="admin-grid"><div class="panel"><h2>Add expense</h2><form id="expenseForm" class="admin-form"><div class="field"><label>Expense</label><input id="expenseName" class="input" required></div><div class="field"><label>Amount</label><input id="expenseAmount" class="input" type="number" required></div><div class="field"><label>Category</label><select id="expenseCategory" class="select"><option>Delivery</option><option>Advertising</option><option>Packaging</option><option>Staff</option><option>Rent</option><option>Utilities</option><option>Product Purchase</option><option>Other</option></select></div><div class="field"><label>Payment method</label><select id="expensePayment" class="select"><option>Cash</option><option>Bank Transfer</option><option>POS</option></select></div><div class="field full"><label>Description</label><textarea id="expenseDescription" class="input textarea"></textarea></div><div class="field full"><button class="btn btn-gold">Save Expense</button></div></form></div><div class="panel"><h2>Expenses</h2><div id="expensesTable"></div></div></div></section><section id="customers" class="admin-section"><div class="panel"><h2>Customers</h2><div id="customersTable" class="table-wrap"></div></div></section><section id="activity" class="admin-section"><div class="panel"><h2>Activity log</h2><div id="activityTable"></div></div></section><section id="settings" class="admin-section"><div class="panel"><h2>Business settings</h2><form id="settingsForm" class="admin-form"><div class="field"><label>Business name</label><input id="setName" class="input"></div><div class="field"><label>WhatsApp number</label><input id="setWa" class="input"></div><div class="field"><label>Default delivery fee</label><input id="setDelivery" class="input" type="number"></div><div class="field full"><button class="btn btn-gold">Save Settings</button></div></form></div></section></main></div><div id="modal" class="modal"><div class="modal-card"><button class="modal-close" onclick="closeProductForm()">×</button><div class="modal-content"><h2>Add / Edit Product</h2><form id="productForm" class="admin-form"><input type="hidden" id="editId"><div class="field"><label>Name</label><input id="pfName" class="input" required></div><div class="field"><label>Brand</label><input id="pfBrand" class="input" required></div><div class="field"><label>Category</label><input id="pfCategory" class="input" value="Perfumes" required></div><div class="field"><label>Price</label><input id="pfPrice" class="input" type="number" required></div><div class="field"><label>Cost price</label><input id="pfCost" class="input" type="number" required></div><div class="field"><label>Stock</label><input id="pfStock" class="input" type="number" required></div><div class="field"><label>Low stock threshold</label><input id="pfThreshold" class="input" type="number" value="3" required></div><div class="field"><label>Rating</label><input id="pfRating" class="input" type="number" step="0.1" value="4.8"></div><div class="field full"><label>Image path</label><input id="pfImage" class="input" value="assets/images/marys-scent-flyer.jpeg"></div><div class="field full"><label>Description</label><textarea id="pfDesc" class="input textarea"></textarea></div><div class="field full"><button class="btn btn-gold">Save Product</button></div></form></div></div></div><div id="toast" class="toast"></div><script src="../js/app.js"></script><script src="../js/admin.js"></script></body></html>
