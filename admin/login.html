<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — Mary's Scent</title><link rel="stylesheet" href="../css/style.css"></head><body class="login-page"><div class="login-card"><div class="brand"><div class="brand-mark">M</div><div class="brand-text"><strong style="color:#111">MARY'S SCENT</strong><span style="color:#9a7a3d">ADMIN PORTAL</span></div></div><h1>Welcome back.</h1><p>Demo owner access for the Mary’s Scent business dashboard.</p><form id="login"><div class="field"><label>Username</label><input class="input" name="username" value="owner" required></div><div class="field" style="margin-top:12px"><label>Password</label><input class="input" type="password" name="password" value="maryscent" required></div><div id="error" class="error" style="margin:10px 0"></div><button class="btn btn-gold" style="width:100%;margin-top:8px">Login</button></form><p style="font-size:.8rem">Demo credentials: <strong>owner</strong> / <strong>maryscent</strong></p><a href="../index.html">← Back to store</a></div><script src="../js/app.js"></script><script>document.querySelector('#login').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);if(f.get('username')==='owner'&&f.get('password')==='maryscent'){MS.set(MS.key.auth,{role:'owner',loggedAt:new Date().toISOString()});location.href='dashboard.html'}else document.querySelector('#error').textContent='Invalid demo credentials.'})</script></body></html>
